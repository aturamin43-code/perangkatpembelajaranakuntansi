        function App() {

                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6 print:shadow-none print:border-none print:p-0">

                                    <li>Gotong Royong: Berdiskusi dalam kelompok pemecahan studi kasus.</li>
                                </ul>
                            </section>

                            <section>
                                <h3 className="font-bold text-teal-700 border-b border-teal-100 pb-1 mb-2 flex items-center space-x-2">
                                    <Icon name="Layers" className="w-4 h-4" />
                                    <span>C. Kegiatan Pembelajaran (Model Problem-Based Learning)</span>
                                </h3>
                                <div className="space-y-2 pl-2">
                                    <p><strong>1. Pendahuluan (15 Menit):</strong> Guru membuka kelas, berdoa, memeriksa presensi, dan memberikan apersepsi terkait transaksi harian.</p>
                                    <p><strong>2. Kegiatan Inti (105 Menit):</strong></p>
                                    <ul className="list-disc list-inside pl-4 space-y-1 text-slate-600">
                                        <li>Orientasi peserta didik pada masalah (Menampilkan bukti transaksi riil).</li>
                                        <li>Mengorganisasikan siswa untuk belajar (Membentuk kelompok kecil).</li>
                                        <li>Membimbing penyelidikan individu/kelompok (Menggunakan Simulasi Jurnal PPA).</li>
                                        <li>Membuka diskusi hasil analisis transaksi.</li>
                                    </ul>
                                    <p><strong>3. Penutup (15 Menit):</strong> Refleksi pembelajaran, kuis singkat, dan penugasan mandiri.</p>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            );
        }

        function ModulesSection() {
            const [selectedModule, setSelectedModule] = useState(MODULES_DATA[0]);

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="space-y-3">
                        <h2 className="text-base font-bold text-slate-800 mb-2">Daftar Materi Ajar</h2>
                        {MODULES_DATA.map((mod) => (
                            <div
                                key={mod.id}
                                onClick={() => setSelectedModule(mod)}
                                className={`p-4 rounded-xl border cursor-pointer transition-all ${
                                    selectedModule.id === mod.id
                                        ? 'bg-teal-50 border-teal-300 shadow-sm'
                                        : 'bg-white border-slate-200 hover:border-slate-300'
                                }`}
                            >
                                <h3 className="font-semibold text-sm text-slate-800">{mod.title}</h3>
                                <p className="text-xs text-slate-500 mt-1 flex items-center">
                                    <Icon name="Clock" className="w-3 h-3 mr-1" />

                                </p>
                            </div>
                        ))}
                    </div>

                    <div className="md:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">

                            <h3 className="text-xl font-bold text-slate-900 mt-1">{selectedModule.title}</h3>
                            <p className="text-xs text-slate-500 mt-1">Alokasi Waktu: {selectedModule.duration}</p>
                        </div>

                        <div className="bg-slate-50 p-3.5 rounded-xl text-xs text-slate-700 border border-slate-100">
                            <strong>Tujuan Pembelajaran:</strong> {selectedModule.objective}
                        </div>

                            {selectedModule.content}
                        </div>
                    </div>
                </div>
            );
        }

        function SimulationSection({ showToast }) {
            const [caseIdx, setCaseIdx] = useState(0);
            const [debitInput, setDebitInput] = useState('');
            const [kreditInput, setKreditInput] = useState('');
            const [feedback, setFeedback] = useState(null);

            const currentCase = SIMULATION_CASES[caseIdx];

            const handleCheck = () => {
                if (!debitInput || !kreditInput) {
                    showToast("Harap pilih akun Debit dan Kredit!");
                    return;
                }

                if (debitInput === currentCase.correctDebit && kreditInput === currentCase.correctKredit) {
                    setFeedback({
                        success: true,
                        message: "Sangat Tepat! Analisis akun dan posisi saldo Anda benar."
                    });
                    showToast("Jawaban Benar! +10 Poin");
                } else {
                    setFeedback({
                        success: false,
                        message: `Kurang tepat. Jawaban yang benar adalah Debit: ${currentCase.correctDebit} & Kredit: ${currentCase.correctKredit}.`
                    });
                }
            };

            const handleNext = () => {
                setDebitInput('');
                setKreditInput('');
                setFeedback(null);
                setCaseIdx((prev) => (prev + 1) % SIMULATION_CASES.length);
            };

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">

                                Level {caseIdx + 1} dari {SIMULATION_CASES.length}
                            </span>
                        </div>

                        <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-sm text-slate-700">

                            <p>{currentCase.description}</p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1.5">Akun DEBIT (+)</label>
                                <select
                                    value={debitInput}
                                    onChange={(e) => setDebitInput(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none"
                                >
                                    <option value="">-- Pilih Akun Debit --</option>
                                    {currentCase.optionsDebit.map((opt, i) => (
                                        <option key={i} value={opt}>{opt}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1.5">Akun KREDIT (+)</label>
                                <select
                                    value={kreditInput}
                                    onChange={(e) => setKreditInput(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-teal-500 outline-none"
                                >
                                    <option value="">-- Pilih Akun Kredit --</option>
                                    {currentCase.optionsKredit.map((opt, i) => (
                                        <option key={i} value={opt}>{opt}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="flex space-x-3 pt-2">
                            <button
                                onClick={handleCheck}
                                className="flex-1 bg-teal-500 hover:bg-teal-600 text-white py-2.5 rounded-xl font-medium text-sm transition-colors shadow-sm"
                            >
                                Periksa Analisis
                            </button>
                            <button
                                onClick={handleNext}
                                className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-medium text-sm transition-colors"
                            >
                                Kasus Berikutnya
                            </button>
                        </div>

                        {feedback && (
                            <div className={`p-4 rounded-xl text-sm border ${
                                feedback.success ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'
                            }`}>
                                <p className="font-semibold">{feedback.message}</p>
                                <p className="text-xs mt-1 text-slate-600"><strong>Penjelasan:</strong> {currentCase.explanation}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function LKPDSection({ showToast }) {
            const [companyName, setCompanyName] = useState('Bengkel Jaya Mandiri');
            const [period, setPeriod] = useState('Januari 2024');

            const handlePrintLKPD = () => {
                showToast("Mencetak LKPD...");
                setTimeout(() => window.print(), 500);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4 no-print">
                        <div className="flex items-center space-x-3">
                            <div>
                                <label className="block text-xs font-semibold text-slate-600">Nama Usaha / Bengkel</label>
                                <input
                                    type="text"
                                    value={companyName}
                                    onChange={(e) => setCompanyName(e.target.value)}
                                    className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600">Periode</label>
                                <input
                                    type="text"
                                    value={period}
                                    onChange={(e) => setPeriod(e.target.value)}
                                    className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-teal-500"
                                />
                            </div>
                        </div>

                        <button
                            onClick={handlePrintLKPD}
                            className="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center space-x-2"
                        >
                            <Icon name="Printer" className="w-4 h-4" />
                            <span>Cetak LKPD</span>
                        </button>
                    </div>

                    {/* Printable LKPD Sheet */}
                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6 print:shadow-none print:border-none print:p-0">
                        <div className="text-center border-b border-slate-200 pb-4">
                            <h2 className="text-xl font-bold uppercase tracking-wide">LEMBAR KERJA PESERTA DIDIK (LKPD)</h2>
                            <p className="text-sm text-slate-600">Pencatatan Transaksi ke Dalam Jurnal Umum</p>
                        </div>

                        <div className="grid grid-cols-2 gap-4 text-xs bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <div><strong>Nama Siswa:</strong> ________________________</div>
                            <div><strong>Kelas / Kelompok:</strong> ________________________</div>
                            <div><strong>Nama Perusahaan:</strong> {companyName}</div>
                            <div><strong>Periode:</strong> {period}</div>
                        </div>

                        <div className="space-y-2">
                            <h4 className="font-semibold text-sm">Petunjuk Kerja:</h4>
                            <ol className="list-decimal list-inside text-xs text-slate-600 space-y-1">
                                <li>Cermati data transaksi yang diberikan oleh guru.</li>
                                <li>Analisis akun yang terpengaruh di posisi Debit dan Kredit.</li>
                                <li>Isikan tanggal, nama akun, ref, serta jumlah ke dalam tabel Jurnal Umum di bawah ini.</li>
                            </ol>
                        </div>

                        {/* Blank General Journal Table for Practice */}
                        <div className="overflow-x-auto">
                            <table className="w-full border-collapse border border-slate-300 text-xs">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-700">
                                        <th className="border border-slate-300 p-2 w-24">Tanggal</th>
                                        <th className="border border-slate-300 p-2">Keterangan / Nama Akun</th>
                                        <th className="border border-slate-300 p-2 w-16 text-center">Ref</th>
                                        <th className="border border-slate-300 p-2 text-right w-32">Debit (Rp)</th>
                                        <th className="border border-slate-300 p-2 text-right w-32">Kredit (Rp)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[...Array(8)].map((_, idx) => (
                                        <tr key={idx} className="h-10">
                                            <td className="border border-slate-300 p-2"></td>
                                            <td className="border border-slate-300 p-2"></td>
                                            <td className="border border-slate-300 p-2"></td>
                                            <td className="border border-slate-300 p-2"></td>
                                            <td className="border border-slate-300 p-2"></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function GameSection({ showToast }) {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);

            const handleAnswer = (optionIdx) => {
                if (optionIdx === QUIZ_QUESTIONS[currentQ].answer) {
                    setScore((prev) => prev + 10);
                    showToast("Jawaban Benar!");
                } else {
                    showToast("Jawaban Salah!");
                }

                if (currentQ + 1 < QUIZ_QUESTIONS.length) {
                    setCurrentQ((prev) => prev + 1);
                } else {
                    setShowResult(true);
                }
            };

            const resetQuiz = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                        {!showResult ? (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center text-xs font-semibold text-slate-500">
                                    <span>Pertanyaan {currentQ + 1} dari {QUIZ_QUESTIONS.length}</span>
                                    <span>Poin Saat Ini: {score}</span>
                                </div>

                                <h3 className="text-base font-bold text-slate-800">
                                    {QUIZ_QUESTIONS[currentQ].question}
                                </h3>

                                <div className="grid grid-cols-1 gap-3">
                                    {QUIZ_QUESTIONS[currentQ].options.map((opt, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleAnswer(idx)}
                                            className="w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-teal-500 hover:bg-teal-50 transition-all font-medium text-sm text-slate-700"
                                        >
                                            {String.fromCharCode(65 + idx)}. {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4 py-6">
                                <div className="w-16 h-16 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                                    🏆
                                </div>
                                <h3 className="text-xl font-bold text-slate-800">Kuis Selesai!</h3>
                                <p className="text-sm text-slate-600">Total Skor Akhir Anda: <strong className="text-teal-600 text-lg">{score}</strong></p>
                                <button
                                    onClick={resetQuiz}
                                    className="bg-teal-500 hover:bg-teal-600 text-white px-6 py-2.5 rounded-xl font-medium text-sm transition-colors shadow-sm"
                                >
                                    Ulangi Kuis
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AttendanceSection({ students, setStudents, showToast }) {
            const handleAttendanceChange = (id, newStatus) => {
                setStudents(students.map(s => s.id === id ? { ...s, attendance: newStatus } : s));
                showToast("Status presensi diperbarui");
            };

            const handleScoreChange = (id, field, value) => {
                const numVal = parseInt(value) || 0;
                setStudents(students.map(s => s.id === id ? { ...s, [field]: numVal } : s));
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div>
                                <h2 className="text-base font-bold text-slate-800">Presensi & Penilaian Siswa</h2>
                                <p className="text-xs text-slate-500">Kelas XI Akuntansi dan Keuangan Lembaga</p>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                                        <th className="p-3">NIS</th>
                                        <th className="p-3">Nama Siswa</th>
                                        <th className="p-3">JK</th>
                                        <th className="p-3">Presensi</th>
                                        <th className="p-3">Nilai Pengetahuan</th>
                                        <th className="p-3">Nilai Keterampilan</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {students.map((student) => (
                                        <tr key={student.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-mono text-xs text-slate-500">{student.nis}</td>
                                            <td className="p-3 font-medium text-slate-800">{student.name}</td>
                                            <td className="p-3 text-xs">{student.gender}</td>
                                            <td className="p-3">
                                                <select
                                                    value={student.attendance}
                                                    onChange={(e) => handleAttendanceChange(student.id, e.target.value)}
                                                    className="border border-slate-200 rounded px-2 py-1 text-xs outline-none focus:border-teal-500"
                                                >
                                                    <option value="Hadir">Hadir</option>
                                                    <option value="Izin">Izin</option>
                                                    <option value="Sakit">Sakit</option>
                                                    <option value="Alpha">Alpha</option>
                                                </select>
                                            </td>
                                            <td className="p-3">
                                                <input
                                                    type="number"
                                                    value={student.scoreUtama}
                                                    onChange={(e) => handleScoreChange(student.id, 'scoreUtama', e.target.value)}
                                                    className="w-16 border border-slate-200 rounded px-2 py-1 text-xs text-center outline-none focus:border-teal-500"
                                                />
                                            </td>
                                            <td className="p-3">
                                                <input
                                                    type="number"
                                                    value={student.scoreKeterampilan}
                                                    onChange={(e) => handleScoreChange(student.id, 'scoreKeterampilan', e.target.value)}
                                                    className="w-16 border border-slate-200 rounded px-2 py-1 text-xs text-center outline-none focus:border-teal-500"
                                                />
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
